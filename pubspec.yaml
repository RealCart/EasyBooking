name: easy_booking
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  #State manager
  flutter_bloc: ^9.1.1
  
  #Routing
  go_router: ^18.1.1
  
  #Local storage
  drift: ^2.35.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  
  #Http
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  #Service locator
  get_it: ^9.3.0

  json_annotation: ^4.12.0
    
  equatable: ^3.0.0
  flutter_svg: ^2.3.0
  meta: ^1.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
